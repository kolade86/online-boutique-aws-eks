---
# HorizontalPodAutoscaler definitions for all Online Boutique microservices
# Requires: metrics-server deployed in kube-system (already configured in platform-services)
# API: autoscaling/v2 (stable since Kubernetes 1.23)
# CPU target: 70% of each container's cpu request
# -------------------------------------------------------------------

# Frontend - customer-facing, highest scaling priority
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
# CartService - on the critical checkout path, backed by Redis
apiVersion: autoscaling/v2
