# k8s/base/servicemonitors.yaml
# ServiceMonitor resources for Prometheus Operator to scrape microservices

---
# ServiceMonitor for Frontend
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-metrics
  labels:
    app: frontend
    release: monitoring
spec:
  selector:
    matchLabels:
      app: frontend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scheme: http

