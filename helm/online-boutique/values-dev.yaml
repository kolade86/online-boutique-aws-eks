# Dev environment overrides

# Image tag deployed to dev. MANAGED BY CI - the "Build Images" workflow
# rewrites this line after pushing to ECR, and Argo CD deploys the commit.
# Change it by merging to main, not by editing the cluster.
image:
  tag: "v20261010-131716-f7f702fa"

services:
  loadgenerator:
    replicas: 0
  sreagent:
    # The agent's own image tag. MANAGED BY CI together with image.tag, but
    # kept separate so that rolling image.tag back never rolls the agent back
    # to a tag that predates its first image. The agent may not change it.
    imageTag: "v20261010-131716-f7f702fa"
  recommendationservice:
    resources:
      requests:
        memory: 220Mi
      limits:
        memory: 450Mi
