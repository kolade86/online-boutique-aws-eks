apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: online-boutique-alerts
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    release: monitoring
spec:
  groups:
    # Every rule here carries a `workload` label: the Deployment the alert is
    # about. AlertManager groups by it (namespace + workload), so one fault
    # sends one email thread per service, not one per alert name. Pod-level
    # rules take it from the pod name, minus the
    # "-<replicaset hash>-<pod suffix>" (the same pattern src/sreagent/alerts.py
    # uses); the others from the deployment or HPA name (an HPA is named after
    # its Deployment in this chart).
    #
    # No request-level alerts (error rate, latency): the services publish no
    # request metrics (they are instrumented for tracing only). Add such rules
    # once a service exports grpc_server_* or http_requests_total.

    # ==========================================
    # Pod Health Alerts
    # ==========================================
    - name: pod-health
      rules:
        - alert: PodCrashLooping
          expr: |
            label_replace(
              rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[5m]) > 0,
              "workload", "$1", "pod", "(.*)-[a-z0-9]{6,10}-[a-z0-9]{5}")
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} is crash looping"
            description: "Pod {{`{{ $labels.pod }}`}} in namespace {{`{{ $labels.namespace }}`}} has been restarting for more than 5 minutes."

        - alert: PodNotReady
          expr: |
            label_replace(
              kube_pod_status_ready{namespace="{{ .Release.Namespace }}", condition="true"} == 0,
              "workload", "$1", "pod", "(.*)-[a-z0-9]{6,10}-[a-z0-9]{5}")
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} is not ready"
            description: "Pod {{`{{ $labels.pod }}`}} has been in a non-ready state for more than 3 minutes."

        - alert: ContainerOOMKilled
          expr: |
            label_replace(
              kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}", reason="OOMKilled"} == 1,
              "workload", "$1", "pod", "(.*)-[a-z0-9]{6,10}-[a-z0-9]{5}")
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Container {{`{{ $labels.container }}`}} was OOM killed"
            description: "Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} was terminated due to OOM."

    # ==========================================
    # Resource Usage Alerts
    # ==========================================
    - name: resource-usage
      rules:
        - alert: HighCPUUsage
          expr: |
            label_replace(
              sum by (pod, namespace) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}", container!=""}[5m]))
              /
              sum by (pod, namespace) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}", resource="cpu"})
              > 0.9,
              "workload", "$1", "pod", "(.*)-[a-z0-9]{6,10}-[a-z0-9]{5}")
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} CPU usage above 90%"
            description: "Pod {{`{{ $labels.pod }}`}} has been using more than 90% of its CPU request for 5 minutes."

        - alert: HighMemoryUsage
          expr: |
            label_replace(
              sum by (pod, namespace) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}", container!=""})
              /
              sum by (pod, namespace) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", resource="memory"})
              > 0.9,
              "workload", "$1", "pod", "(.*)-[a-z0-9]{6,10}-[a-z0-9]{5}")
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} memory usage above 90%"
            description: "Pod {{`{{ $labels.pod }}`}} is using more than 90% of its memory limit for 5 minutes."

    # ==========================================
    # Deployment Alerts
    # ==========================================
    - name: deployment-health
      rules:
        - alert: DeploymentReplicasMismatch
          expr: |
            label_replace(
              kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
              !=
              kube_deployment_status_ready_replicas{namespace="{{ .Release.Namespace }}"},
              "workload", "$1", "deployment", "(.+)")
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{`{{ $labels.deployment }}`}} has replica mismatch"
            description: "Deployment {{`{{ $labels.deployment }}`}} has not matched the expected number of replicas for 5 minutes."

        - alert: HpaMaxedOut
          expr: |
            label_replace(
              kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ .Release.Namespace }}"}
              ==
              kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ .Release.Namespace }}"},
              "workload", "$1", "horizontalpodautoscaler", "(.+)")
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{`{{ $labels.horizontalpodautoscaler }}`}} is at max replicas"
            description: "HPA {{`{{ $labels.horizontalpodautoscaler }}`}} has been running at maximum capacity for 10 minutes. Consider increasing max replicas."
