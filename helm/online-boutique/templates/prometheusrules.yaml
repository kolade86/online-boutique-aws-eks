apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: online-boutique-alerts
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    release: monitoring
spec:
  groups:
    # ==========================================
    # Pod Health Alerts
    # ==========================================
    - name: pod-health
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} is crash looping"
            description: "Pod {{`{{ $labels.pod }}`}} in namespace {{`{{ $labels.namespace }}`}} has been restarting for more than 5 minutes."

        - alert: PodNotReady
          expr: kube_pod_status_ready{namespace="{{ .Release.Namespace }}", condition="true"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} is not ready"
            description: "Pod {{`{{ $labels.pod }}`}} has been in a non-ready state for more than 3 minutes."

        - alert: ContainerOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}", reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Container {{`{{ $labels.container }}`}} was OOM killed"
            description: "Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} was terminated due to OOM."

    # ==========================================
    # Resource Usage Alerts
    # ==========================================
    - name: resource-usage
      rules:
        - alert: HighCPUUsage
          expr: |
            sum by (pod, namespace) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}", container!=""}[5m]))
            /
            sum by (pod, namespace) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}", resource="cpu"})
            > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} CPU usage above 90%"
            description: "Pod {{`{{ $labels.pod }}`}} has been using more than 90% of its CPU request for 5 minutes."

        - alert: HighMemoryUsage
          expr: |
            sum by (pod, namespace) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}", container!=""})
            /
            sum by (pod, namespace) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", resource="memory"})
            > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} memory usage above 90%"
            description: "Pod {{`{{ $labels.pod }}`}} is using more than 90% of its memory limit for 5 minutes."

    # ==========================================
    # Deployment Alerts
    # ==========================================
    - name: deployment-health
      rules:
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
            !=
            kube_deployment_status_ready_replicas{namespace="{{ .Release.Namespace }}"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{`{{ $labels.deployment }}`}} has replica mismatch"
            description: "Deployment {{`{{ $labels.deployment }}`}} has not matched the expected number of replicas for 5 minutes."

        - alert: HpaMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ .Release.Namespace }}"}
            ==
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ .Release.Namespace }}"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{`{{ $labels.horizontalpodautoscaler }}`}} is at max replicas"
            description: "HPA {{`{{ $labels.horizontalpodautoscaler }}`}} has been running at maximum capacity for 10 minutes. Consider increasing max replicas."

    # ==========================================
    # gRPC Service Alerts
    # ==========================================
    - name: grpc-services
      rules:
        - alert: HighGrpcErrorRate
          expr: |
            sum by (grpc_service) (rate(grpc_server_handled_total{namespace="{{ .Release.Namespace }}", grpc_code!="OK"}[5m]))
            /
            sum by (grpc_service) (rate(grpc_server_handled_total{namespace="{{ .Release.Namespace }}"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "gRPC service {{`{{ $labels.grpc_service }}`}} error rate above 5%"
            description: "gRPC service {{`{{ $labels.grpc_service }}`}} has had an error rate above 5% for 5 minutes."

        - alert: HighGrpcLatency
          expr: |
            histogram_quantile(0.99,
              sum by (grpc_service, le) (rate(grpc_server_handling_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "gRPC service {{`{{ $labels.grpc_service }}`}} p99 latency above 500ms"
            description: "gRPC service {{`{{ $labels.grpc_service }}`}} has p99 latency above 500ms for 5 minutes."

    # ==========================================
    # Frontend (HTTP) Alerts
    # ==========================================
    - name: frontend
      rules:
        - alert: HighHttpErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Frontend HTTP 5xx error rate above 5%"
            description: "The frontend service has had more than 5% HTTP 5xx errors for 5 minutes."

    # ==========================================
    # Redis (Cart Backend) Alerts
    # ==========================================
    - name: redis
      rules:
        - alert: RedisDown
          expr: up{job="redis-exporter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis exporter is down"
            description: "Redis exporter has been unreachable for 2 minutes. Cart service may be impacted."
