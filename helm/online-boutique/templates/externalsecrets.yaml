{{- /*
ExternalSecrets for services that set `externalSecret.name`. The Kubernetes
Secret of that name is synced from the Secrets Manager secret
"<externalSecrets.remoteKeyPrefix>-<service>", one key per `secretEnv` entry
that reads from it, so the Deployment and the service's code are unchanged.

Rendered only when Terraform has passed the SecretStore and the name prefix
(Argo CD Helm parameters). Without them nothing is rendered and the Secret must
be created by hand, as before.

creationPolicy Owner adopts an existing Secret of the same name that has no
ownerReference (one created by hand), so migrating keeps the Secret in place.
*/}}
{{- $store := .Values.externalSecrets.secretStore }}
{{- $prefix := .Values.externalSecrets.remoteKeyPrefix }}
{{- if and $store $prefix }}
{{- range $name, $svc := .Values.services }}
{{- if and (ne $svc.enabled false) $svc.externalSecret }}
{{- $target := $svc.externalSecret.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $target }}
  labels:
    app: {{ $name }}
    {{- include "online-boutique.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: {{ $target }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $svc.secretEnv }}
  {{- if eq .secret $target }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ $prefix }}-{{ $name }}
        property: {{ .key }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
