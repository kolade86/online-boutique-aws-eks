{{- range $name, $svc := .Values.services }}
{{- if ne $svc.enabled false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "online-boutique.labels" $ | nindent 4 }}
spec:
  {{- /* With an HPA, the HPA owns the replica count. Rendering replicas here
       would make Argo CD self-heal reset it on every HPA scale event. */}}
  {{- if not (and $svc.hpa (not $svc.noHpa)) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "online-boutique.labels" $ | nindent 8 }}
      {{- if $svc.podAnnotations }}
      annotations:
        {{- toYaml $svc.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- if $svc.serviceAccount }}
      serviceAccountName: {{ $name }}
      {{- end }}
      containers:
      - name: {{ $svc.containerName | default "server" }}
        image: {{ include "online-boutique.image" (dict "svc" $svc "global" $.Values "name" $name) }}
        {{- if $svc.port }}
        ports:
        - containerPort: {{ $svc.port }}
        {{- end }}
        env:
        {{- if $svc.useRedis }}
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: REDIS_ADDR
        {{- end }}
        {{- range $svc.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- /* Values from a Secret that is created by hand, never from Git */}}
        {{- range $svc.secretEnv }}
        - name: {{ .name }}
          valueFrom:
            secretKeyRef:
              name: {{ .secret }}
              key: {{ .key }}
        {{- end }}
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
        {{- if $svc.readinessProbe }}
        readinessProbe:
          {{- toYaml $svc.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if $svc.livenessProbe }}
        livenessProbe:
          {{- toYaml $svc.livenessProbe | nindent 10 }}
        {{- end }}
{{- end }}
{{- end }}
