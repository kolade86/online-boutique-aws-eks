{{- range $name, $svc := .Values.services }}
{{- if not $svc.noService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "online-boutique.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
  - name: {{ $svc.protocol | default "grpc" }}
    port: {{ $svc.servicePort | default $svc.port }}
    targetPort: {{ $svc.port }}
{{- end }}
{{- end }}
