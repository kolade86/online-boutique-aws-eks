        port: 50051
    hpa:
      minReplicas: 2
      maxReplicas: 4
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: grpc
      path: /metrics

  emailservice:
    port: 8080
    protocol: grpc
    replicas: 2
    containerName: server
    env:
      - name: PORT
        value: "8080"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    readinessProbe:
      grpc:
        port: 8080
    livenessProbe:
      grpc:
        port: 8080
    hpa:
      minReplicas: 1
      maxReplicas: 3
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: grpc
      path: /metrics

  checkoutservice:
    port: 5050
    protocol: grpc
    replicas: 2
    containerName: server
    env:
      - name: PORT
        value: "5050"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: PAYMENT_SERVICE_ADDR
