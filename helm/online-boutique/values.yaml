        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    readinessProbe:
      grpc:
        port: 7000
    livenessProbe:
      grpc:
        port: 7000
    hpa:
      minReplicas: 2
      maxReplicas: 4
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: grpc
      path: /metrics

  paymentservice:
