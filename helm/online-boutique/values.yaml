  loadgenerator:
    replicas: 1
    containerName: main
    noService: true
    noHpa: true
    noPdb: true
    noServiceMonitor: true
    env:
      - name: FRONTEND_ADDR
        value: "frontend:80"
      - name: USERS
        value: "10"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  shoppingassistantservice:
    port: 80
    protocol: http
    replicas: 1
    containerName: dummy
    staticImage: nginx:alpine
    env: []
    resources:
      requests:
        cpu: 50m
