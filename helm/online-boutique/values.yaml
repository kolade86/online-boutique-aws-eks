    env:
      - name: PORT
        value: "50051"
      - name: ENABLE_PROFILER
        value: "0"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    readinessProbe:
      grpc:
        port: 50051
    livenessProbe:
      grpc:
        port: 50051
    hpa:
      minReplicas: 2
      maxReplicas: 5
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: grpc
      path: /metrics

  shippingservice:
    port: 50051
    protocol: grpc
    replicas: 2
    containerName: server
