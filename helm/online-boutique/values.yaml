# Global image settings - passed at deploy time, never hardcoded
image:
  registry: ""  # e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
  prefix: ""    # e.g. online-boutique-dev
  tag: "latest"

# Redis configuration - passed at deploy time
redis:
  addr: ""  # e.g. online-boutique-dev-redis.abc123.ng.0001.use1.cache.amazonaws.com:6379

# Ingress
ingress:
  enabled: true
  loadBalancerName: online-boutique-alb
  healthCheckPath: /_healthz

# Service definitions
services:
  frontend:
    port: 8080
    servicePort: 80
    protocol: http
    replicas: 2
    containerName: server
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: RECOMMENDATION_SERVICE_ADDR
        value: "recommendationservice:8080"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: CHECKOUT_SERVICE_ADDR
        value: "checkoutservice:5050"
      - name: AD_SERVICE_ADDR
        value: "adservice:9555"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shoppingassistantservice:80"
      - name: ENABLE_PROFILER
        value: "0"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    readinessProbe:
      httpGet:
        path: /_healthz
        port: 8080
        httpHeaders:
          - name: Cookie
            value: "shop_session-id=x-readiness-probe"
      initialDelaySeconds: 10
    livenessProbe:
      httpGet:
        path: /_healthz
        port: 8080
        httpHeaders:
          - name: Cookie
            value: "shop_session-id=x-liveness-probe"
      initialDelaySeconds: 10
    hpa:
      minReplicas: 2
      maxReplicas: 5
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: http
      path: /metrics

  cartservice:
    port: 7070
    protocol: grpc
    replicas: 2
    containerName: server
    useRedis: true
    env:
      - name: PORT
        value: "7070"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    readinessProbe:
      grpc:
        port: 7070
      initialDelaySeconds: 10
    livenessProbe:
      grpc:
        port: 7070
      initialDelaySeconds: 15
    hpa:
      minReplicas: 2
      maxReplicas: 5
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: grpc
      path: /metrics

  productcatalogservice:
    port: 3550
    protocol: grpc
    replicas: 2
    containerName: server
    env:
      - name: PORT
        value: "3550"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    readinessProbe:
      grpc:
        port: 3550
    livenessProbe:
      grpc:
        port: 3550
    hpa:
      minReplicas: 2
      maxReplicas: 4
      cpuUtilization: 70
    pdb:
      minAvailable: 1
    serviceMonitor:
      port: grpc
      path: /metrics

  currencyservice:
