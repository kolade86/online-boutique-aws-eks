apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-monitoring-kube-prometheus-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "online-boutique-monitoring.labels" . | nindent 4 }}
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@{{ .Values.projectName }}.local'

    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default'
      routes:
      - match:
          severity: critical
        receiver: sns-critical
      - match:
          severity: warning
        receiver: sns-warning

    receivers:
    - name: 'default'
      webhook_configs:
      - url: 'http://127.0.0.1:5001/'

    - name: 'sns-critical'
      sns_configs:
      - topic_arn: '{{ .Values.sns.topicArn }}'
        subject: '[CRITICAL] {{ .Values.projectName | title }} {{ .Values.environment | title }} Alert'
        message: |
          Alert: {{`{{ .GroupLabels.alertname }}`}}
          Severity: {{`{{ .CommonLabels.severity }}`}}
          Instance: {{`{{ .CommonLabels.instance }}`}}
          Summary: {{`{{ .CommonAnnotations.summary }}`}}
          Description: {{`{{ .CommonAnnotations.description }}`}}

    - name: 'sns-warning'
      sns_configs:
      - topic_arn: '{{ .Values.sns.topicArn }}'
        subject: '[WARNING] {{ .Values.projectName | title }} {{ .Values.environment | title }} Alert'
        message: |
          Alert: {{`{{ .GroupLabels.alertname }}`}}
          Severity: {{`{{ .CommonLabels.severity }}`}}
          Instance: {{`{{ .CommonLabels.instance }}`}}
          Summary: {{`{{ .CommonAnnotations.summary }}`}}
          Description: {{`{{ .CommonAnnotations.description }}`}}