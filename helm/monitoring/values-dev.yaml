# Development environment overrides
environment: dev

serviceAccounts:
  prometheus:
    roleArn: arn:aws:iam::401399516967:role/online-boutique-prometheus-role
  alertmanager:
    roleArn: arn:aws:iam::401399516967:role/online-boutique-alertmanager-sns-role

sns:
  topicArn: arn:aws:sns:us-east-1:401399516967:online-boutique-dev-alertmanager-notifications

grafana:
  ingress:
    scheme: internet-facing
    loadBalancerName: monitoring-dev-alb

# Development-specific overrides
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 10Gi