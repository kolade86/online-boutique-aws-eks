name: Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'helm/**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go services share the same version and test command
  test-go:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - checkoutservice
          - productcatalogservice
          - shippingservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: src/${{ matrix.service }}/go.sum

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: go test -v -race -count=1 ./...

  # C# cartservice uses .NET and xUnit
  test-dotnet:
    name: "Test: cartservice"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        working-directory: src/cartservice
        run: dotnet test --verbosity normal

  # Node.js services (currencyservice, paymentservice)
  test-node:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - currencyservice
          - paymentservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: src/${{ matrix.service }}
        run: npm install --ignore-scripts

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: npm test

  # Python services (emailservice, recommendationservice)
  test-python:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - emailservice
          - recommendationservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: python -m unittest discover -s . -p 'test_*.py' -v

  # Java adservice uses Gradle and JUnit 5
  test-java:
    name: "Test: adservice"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '19'
          cache: 'gradle'

      - name: Run tests
        working-directory: src/adservice
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # Summary job for branch protection rules
  # SRE agent. Its tests skip themselves when a package is missing (so they
  # run anywhere), which in CI would hide untested code: install everything
  # and fail if anything was skipped.
  test-sreagent:
    name: "Test: sreagent"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/sreagent/requirements.txt

      - name: Install dependencies
        working-directory: src/sreagent
        # httpx is only for FastAPI's TestClient, so not in requirements.txt
        run: pip install -r requirements.txt httpx

      - name: Run tests
        working-directory: src/sreagent
        run: |
          set -o pipefail
          python -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee test-output.txt
          if grep -qE '^OK \(skipped=|skipped [0-9]+' test-output.txt; then
            echo "::error::Some sreagent tests were skipped - a dependency is missing"
            exit 1
          fi

  test-summary:
    name: Tests Summary
    needs: [test-go, test-dotnet, test-node, test-python, test-java, test-sreagent]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check results
        run: |
          FAILED=false
          for result in \
            "${{ needs.test-go.result }}" \
            "${{ needs.test-dotnet.result }}" \
            "${{ needs.test-node.result }}" \
            "${{ needs.test-python.result }}" \
            "${{ needs.test-java.result }}" \
            "${{ needs.test-sreagent.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::error::Some tests failed"
            exit 1
          fi
          echo "All tests passed"
