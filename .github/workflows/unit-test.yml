name: Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'helm/**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go services share the same version and test command
  test-go:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - checkoutservice
          - productcatalogservice
          - shippingservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/${{ matrix.service }}/go.sum

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: go test -v -race -count=1 ./...

  # C# cartservice uses .NET and xUnit
  test-dotnet:
    name: "Test: cartservice"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        working-directory: src/cartservice
        run: dotnet test --verbosity normal

  # Node.js services (currencyservice, paymentservice)
  test-node:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - currencyservice
          - paymentservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: src/${{ matrix.service }}
        run: npm install --ignore-scripts

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: npm test

  # Python services (emailservice, recommendationservice)
  test-python:
    name: "Test: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - emailservice
          - recommendationservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        working-directory: src/${{ matrix.service }}
        run: python -m unittest discover -s . -p 'test_*.py' -v

  # Java adservice uses Gradle and JUnit 5
  test-java:
    name: "Test: adservice"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '19'
          cache: 'gradle'

      - name: Run tests
        working-directory: src/adservice
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # Summary job for branch protection rules
  test-summary:
    name: Tests Summary
    needs: [test-go, test-dotnet, test-node, test-python, test-java]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check results
        run: |
          FAILED=false
          for result in \
            "${{ needs.test-go.result }}" \
            "${{ needs.test-dotnet.result }}" \
            "${{ needs.test-node.result }}" \
            "${{ needs.test-python.result }}" \
            "${{ needs.test-java.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::error::Some tests failed"
            exit 1
          fi
          echo "All tests passed"
