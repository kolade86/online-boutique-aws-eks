name: Bootstrap Terraform Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (for naming)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PROJECT_NAME: online-boutique
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '648098100376'
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  AWS_ROLE_ARN: arn:aws:iam::648098100376:role/online-boutique-github-actions-role

permissions:
  id-token: write
  contents: read

jobs:
  create-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Bootstrap-${{ github.run_id }}
      
      - name: Create S3 Bucket and DynamoDB Table
        id: create
        run: |
          BUCKET_NAME="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-terraform-state"
          DYNAMODB_TABLE="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-terraform-locks"
          
          echo "=== Creating Terraform Backend ==="
          echo "Bucket: ${BUCKET_NAME}"
          echo "DynamoDB Table: ${DYNAMODB_TABLE}"
          echo ""
          
          # Create S3 bucket
          echo "Creating S3 bucket..."
          if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region ${{ env.AWS_REGION }}
          else
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
          fi
          
          # Enable versioning
          echo "Enabling versioning..."
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET_NAME}" \
            --versioning-configuration Status=Enabled
          
          # Enable default encryption
          echo "Enabling encryption..."
          aws s3api put-bucket-encryption \
            --bucket "${BUCKET_NAME}" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }'
          
          # Block public access
          echo "Blocking public access..."
          aws s3api put-public-access-block \
            --bucket "${BUCKET_NAME}" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          
          echo "✅ S3 bucket created: ${BUCKET_NAME}"
          
          # Create DynamoDB table
          echo ""
          echo "Creating DynamoDB table..."
          aws dynamodb create-table \
            --table-name "${DYNAMODB_TABLE}" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_REGION }}
          
          echo "Waiting for table to be active..."
          aws dynamodb wait table-exists --table-name "${DYNAMODB_TABLE}" --region ${{ env.AWS_REGION }}
          
          echo "✅ DynamoDB table created: ${DYNAMODB_TABLE}"
          
          # Store for summary
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV
          echo "DYNAMODB_TABLE=${DYNAMODB_TABLE}" >> $GITHUB_ENV
      
      - name: Summary
        run: |
          {
            echo "## ✅ Terraform Backend Created"
            echo ""
            echo "- **S3 Bucket**: \`${{ env.BUCKET_NAME }}\`"
            echo "- **DynamoDB Table**: \`${{ env.DYNAMODB_TABLE }}\`"
            echo "- **Region**: \`${{ env.AWS_REGION }}\`"
            echo ""
            echo "### Copy this to \`terraform/environments/${{ env.ENVIRONMENT }}/backend.tf\`"
            echo ""
            echo "\`\`\`hcl"
            echo "# terraform/environments/${{ env.ENVIRONMENT }}/backend.tf"
            echo ""
            echo "terraform {"
            echo "  backend \"s3\" {"
            echo "    bucket         = \"${{ env.BUCKET_NAME }}\""
            echo "    key            = \"terraform.tfstate\""
            echo "    region         = \"${{ env.AWS_REGION }}\""
            echo "    encrypt        = true"
            echo "    dynamodb_table = \"${{ env.DYNAMODB_TABLE }}\""
            echo "  }"
            echo "}"
            echo "\`\`\`"
            echo ""
            echo "### Then run:"
            echo "\`\`\`bash"
            echo "cd terraform/environments/${{ env.ENVIRONMENT }}"
            echo "terraform init"
            echo "terraform apply"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
