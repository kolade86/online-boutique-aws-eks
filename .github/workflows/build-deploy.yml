name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      project_name:
        description: 'Project name'
        required: true
        default: 'online-boutique'
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      aws_account_id:
        description: 'AWS Account ID'
        required: true
        default: '225934518357'
      services:
        description: 'Services to build (comma-separated or "all")'
        required: false
        default: 'frontend'
      skip_build:
        description: 'Skip build and only deploy'
        required: false
        default: false
        type: boolean
      image_tag:
        description: 'Specific image tag to deploy (if skip_build=true)'
        required: false

env:
  PROJECT_NAME: ${{ github.event.inputs.project_name }}
  AWS_REGION: ${{ github.event.inputs.aws_region }}
  AWS_ACCOUNT_ID: ${{ github.event.inputs.aws_account_id }}
  ECR_REGISTRY: ${{ github.event.inputs.aws_account_id }}.dkr.ecr.${{ github.event.inputs.aws_region }}.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::${{ github.event.inputs.aws_account_id }}:role/${{ github.event.inputs.project_name }}-github-actions-role

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services-matrix: ${{ steps.services.outputs.matrix }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      should-build: ${{ steps.build-decision.outputs.should-build }}
    
    steps:
      - name: Prepare services matrix
        id: services
        run: |
          ALL_SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]'
          
          if [ "${{ github.event.inputs.services }}" = "all" ]; then
            echo "matrix=${ALL_SERVICES}" >> $GITHUB_OUTPUT
          else
            # Convert comma-separated input to JSON array
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            SERVICES_JSON="["
            for i in "${!SERVICES[@]}"; do
              if [ $i -gt 0 ]; then SERVICES_JSON+=","; fi
              SERVICES_JSON+="\"$(echo ${SERVICES[i]} | xargs)\""  # Trim whitespace
            done
            SERVICES_JSON+="]"
            echo "matrix=${SERVICES_JSON}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate image metadata
        id: meta
        run: |
          if [ "${{ github.event.inputs.skip_build }}" = "true" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=${GITHUB_SHA::8}
            IMAGE_TAG="v${TIMESTAMP}-${SHORT_SHA}"
          fi
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Build decision
        id: build-decision
        run: |
          if [ "${{ github.event.inputs.skip_build }}" = "true" ]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
          else
            echo "should-build=true" >> $GITHUB_OUTPUT
          fi

  build:
    if: needs.prepare.outputs.should-build == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services-matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine build paths
        id: paths
        run: |
          SERVICE="${{ matrix.service }}"
          
          if [ "${SERVICE}" = "cartservice" ]; then
            BUILD_CONTEXT="./src/cartservice/src"
            DOCKERFILE="Dockerfile"
          else
            BUILD_CONTEXT="./src/${SERVICE}"
            DOCKERFILE="Dockerfile"
          fi
          
          echo "build-context=${BUILD_CONTEXT}" >> $GITHUB_OUTPUT
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT
          
          echo "=== Build Configuration for ${SERVICE} ==="
          echo "Build context: ${BUILD_CONTEXT}"
          echo "Dockerfile: ${DOCKERFILE}"
          
          # Verify paths exist
          if [ ! -d "${BUILD_CONTEXT}" ]; then
            echo "ERROR: Build context directory does not exist: ${BUILD_CONTEXT}"
            exit 1
          fi
          
          if [ ! -f "${BUILD_CONTEXT}/${DOCKERFILE}" ]; then
            echo "ERROR: Dockerfile does not exist: ${BUILD_CONTEXT}/${DOCKERFILE}"
            echo "Contents of ${BUILD_CONTEXT}:"
            ls -la "${BUILD_CONTEXT}"
            exit 1
          fi
          
          echo "✅ Paths verified for ${SERVICE}"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          
          if ! aws ecr describe-repositories --repository-names "${REPO_NAME}" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "Creating ECR repository: ${REPO_NAME}"
            aws ecr create-repository \
              --repository-name "${REPO_NAME}" \
              --region ${{ env.AWS_REGION }} \
              --image-scanning-configuration scanOnPush=true
          else
            echo "ECR repository ${REPO_NAME} already exists"
          fi
      
      - name: Build and push image
        working-directory: ${{ steps.paths.outputs.build-context }}
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image-tag }}"
          
          IMAGE_VERSIONED="${{ env.ECR_REGISTRY }}/${REPO_NAME}:${IMAGE_TAG}"
          IMAGE_LATEST="${{ env.ECR_REGISTRY }}/${REPO_NAME}:latest"
          
          echo "=== Building ${{ matrix.service }} ==="
          echo "Working directory: $(pwd)"
          echo "Repository: ${REPO_NAME}"
          echo "Tag: ${IMAGE_TAG}"
          echo "Dockerfile: ${{ steps.paths.outputs.dockerfile }}"
          
          echo "Contents of build context:"
          ls -la .
          
          # Build with progress output
          docker build \
            --no-cache \
            --progress=plain \
            -f ${{ steps.paths.outputs.dockerfile }} \
            -t "${IMAGE_VERSIONED}" \
            -t "${IMAGE_LATEST}" \
            .
          
          echo "Pushing images..."
          docker push "${IMAGE_VERSIONED}"
          docker push "${IMAGE_LATEST}"
          
          echo "✅ Successfully built and pushed ${{ matrix.service }}:"
          echo "  Versioned: ${IMAGE_VERSIONED}"
          echo "  Latest: ${IMAGE_LATEST}"

  get-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      redis-endpoint: ${{ steps.infrastructure.outputs.redis-endpoint }}
      cluster-name: ${{ steps.infrastructure.outputs.cluster-name }}
      namespace: ${{ steps.infrastructure.outputs.namespace }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Discover infrastructure
        id: infrastructure
        run: |
          ENV="${{ github.event.inputs.environment }}"
          
          echo "=== Infrastructure Discovery ==="
          
          # Discover Redis - we know the exact name from your output
          REDIS_ID="${{ env.PROJECT_NAME }}-${ENV}-redis"
          echo "Looking for Redis cluster: ${REDIS_ID}"
          
          REDIS_ENDPOINT=$(aws elasticache describe-replication-groups \
            --replication-group-id "${REDIS_ID}" \
            --region ${{ env.AWS_REGION }} \
            --query 'ReplicationGroups[0].NodeGroups[0].PrimaryEndpoint.Address' \
            --output text):6379
          
          if [ "${REDIS_ENDPOINT}" = "None:6379" ]; then
            echo "ERROR: Redis cluster not found: ${REDIS_ID}"
            aws elasticache describe-replication-groups --region ${{ env.AWS_REGION }} --query 'ReplicationGroups[*].ReplicationGroupId' --output text
            exit 1
          fi
          
          echo "✅ Redis found: ${REDIS_ENDPOINT}"
          
          # Discover EKS - we know the exact name from your output
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${ENV}-cluster"
          echo "Looking for EKS cluster: ${CLUSTER_NAME}"
          
          if aws eks describe-cluster --name "${CLUSTER_NAME}" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "✅ EKS cluster found: ${CLUSTER_NAME}"
          else
            echo "ERROR: EKS cluster not found: ${CLUSTER_NAME}"
            echo "Available clusters:"
            aws eks list-clusters --region ${{ env.AWS_REGION }} --query 'clusters' --output text
            exit 1
          fi
          
          # Set namespace
          NAMESPACE="${{ env.PROJECT_NAME }}-${ENV}"
          
          echo "=== Infrastructure Summary ==="
          echo "Redis: ${REDIS_ENDPOINT}"
          echo "EKS: ${CLUSTER_NAME}"
          echo "Namespace: ${NAMESPACE}"
          
          echo "redis-endpoint=${REDIS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "cluster-name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, get-infrastructure]
    if: always() && !failure() && (needs.prepare.outputs.should-build == 'false' || needs.build.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.get-infrastructure.outputs.cluster-name }} \
            --region ${{ env.AWS_REGION }}
          
          # Verify connection
          kubectl cluster-info
          echo "✅ kubectl configured successfully"
      
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
      - name: Create namespace if needed
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"
          if ! kubectl get namespace "${NAMESPACE}" > /dev/null 2>&1; then
            echo "Creating namespace: ${NAMESPACE}"
            kubectl create namespace "${NAMESPACE}"
          else
            echo "Namespace ${NAMESPACE} already exists"
          fi
      
      - name: Generate deployment configuration
        run: |
          ENV="${{ github.event.inputs.environment }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image-tag }}"
          REDIS_ENDPOINT="${{ needs.get-infrastructure.outputs.redis-endpoint }}"
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"
          
          # Create deployment overlay
          OVERLAY_DIR="k8s/overlays/${ENV}-deploy-$(date +%s)"
          mkdir -p "${OVERLAY_DIR}"
          
          echo "=== Generating Deployment Configuration ==="
          echo "Environment: ${ENV}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Redis endpoint: ${REDIS_ENDPOINT}"
          echo "Namespace: ${NAMESPACE}"
          echo "Overlay directory: ${OVERLAY_DIR}"
          
          # Generate kustomization.yaml
          cat > "${OVERLAY_DIR}/kustomization.yaml" << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          namespace: ${NAMESPACE}
          
          resources:
            - ../../base
          
          configMapGenerator:
            - name: redis-config
              literals:
                - REDIS_ADDR=${REDIS_ENDPOINT}
              behavior: replace
          
          images:
          EOF
          
          # Add image transformations for selected services
          SERVICES=(${{ join(fromJson(needs.prepare.outputs.services-matrix), ' ') }})
          for service in "${SERVICES[@]}"; do
            cat >> "${OVERLAY_DIR}/kustomization.yaml" << EOF
            - name: ${service}
              newName: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${ENV}-${service}
              newTag: ${IMAGE_TAG}
          EOF
          done
          
          # Add labels
          cat >> "${OVERLAY_DIR}/kustomization.yaml" << EOF
          
          labels:
            - pairs:
                app.kubernetes.io/version: ${IMAGE_TAG}
                app.kubernetes.io/environment: ${ENV}
                app.kubernetes.io/managed-by: github-actions
          EOF
          
          # Add environment-specific patches
          if [ "${ENV}" = "dev" ]; then
            cat > "${OVERLAY_DIR}/loadgen-patch.yaml" << EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: loadgenerator
          spec:
            replicas: 0
          EOF
            echo "" >> "${OVERLAY_DIR}/kustomization.yaml"
            echo "patchesStrategicMerge:" >> "${OVERLAY_DIR}/kustomization.yaml"
            echo "  - loadgen-patch.yaml" >> "${OVERLAY_DIR}/kustomization.yaml"
          fi
          
          echo "OVERLAY_DIR=${OVERLAY_DIR}" >> $GITHUB_ENV
      
      - name: Validate generated configuration
        run: |
          echo "=== Generated Kustomization ==="
          cat "${OVERLAY_DIR}/kustomization.yaml"
          echo ""
          echo "=== Configuration Preview (first 50 lines) ==="
          kustomize build "${OVERLAY_DIR}" | head -50
      
      - name: Apply deployment
        run: |
          echo "=== Deploying to Kubernetes ==="
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Namespace: ${{ needs.get-infrastructure.outputs.namespace }}"
          echo "Image tag: ${{ needs.prepare.outputs.image-tag }}"
          echo "Redis endpoint: ${{ needs.get-infrastructure.outputs.redis-endpoint }}"
          
          kustomize build "${OVERLAY_DIR}" | kubectl apply -f -
          echo "✅ Deployment applied successfully"
      
      - name: Wait for deployment
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"
          
          echo "=== Waiting for deployments to be ready ==="
          
          # Get all deployments that were just applied
          DEPLOYMENTS=$(kubectl get deployments -n "${NAMESPACE}" -o name | cut -d'/' -f2)
          
          for deployment in $DEPLOYMENTS; do
            echo "Waiting for deployment/${deployment}..."
            if kubectl rollout status deployment/${deployment} -n "${NAMESPACE}" --timeout=300s; then
              echo "✅ ${deployment} is ready"
            else
              echo "⚠️  ${deployment} failed to become ready"
              kubectl describe deployment/${deployment} -n "${NAMESPACE}"
              kubectl get pods -n "${NAMESPACE}" -l app=${deployment}
            fi
          done
      
      - name: Verify deployment
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"
          
          echo "=== Deployment Verification ==="
          echo "Namespace: ${NAMESPACE}"
          echo "Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          echo ""
          
          echo "=== Pod Status ==="
          kubectl get pods -n "${NAMESPACE}" -o wide
          echo ""
          
          echo "=== Service Status ==="
          kubectl get svc -n "${NAMESPACE}"
          echo ""
          
          echo "=== Ingress Status ==="
          kubectl get ingress -n "${NAMESPACE}" || echo "No ingress found"
          echo ""
          
          echo "=== Recent Events ==="
          kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' | tail -10
      
      - name: Test Redis connectivity
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"
          REDIS_HOST=$(echo "${{ needs.get-infrastructure.outputs.redis-endpoint }}" | cut -d':' -f1)
          REDIS_PORT=$(echo "${{ needs.get-infrastructure.outputs.redis-endpoint }}" | cut -d':' -f2)
          
          echo "=== Testing Redis Connectivity ==="
          echo "Testing connection to ${REDIS_HOST}:${REDIS_PORT}"
          
          kubectl run redis-test-$(date +%s) --image=busybox --rm -i --restart=Never \
            -n "${NAMESPACE}" \
            --command -- sh -c "nc -zv ${REDIS_HOST} ${REDIS_PORT} && echo 'Redis connection: SUCCESS' || echo 'Redis connection: FAILED'"
      
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${OVERLAY_DIR}" ] && [ -d "${OVERLAY_DIR}" ]; then
            rm -rf "${OVERLAY_DIR}"
            echo "Cleaned up overlay directory"
          fi
