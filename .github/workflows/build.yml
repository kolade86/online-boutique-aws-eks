name: Build Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      project_name:
        description: 'Project name'
        required: true
        default: 'online-boutique'
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      aws_account_id:
        description: 'AWS Account ID'
        required: true
        default: '958312553089'
      services:
        description: 'Services to build (comma-separated or "all")'
        required: false
        default: 'all'
  push:
    branches: [ main ]
    paths:
    - 'src/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/**'

env:
  PROJECT_NAME: ${{ github.event.inputs.project_name || 'online-boutique' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ github.event.inputs.aws_account_id || '958312553089' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  ECR_REGISTRY: ${{ github.event.inputs.aws_account_id || '958312553089' }}.dkr.ecr.${{ github.event.inputs.aws_region || 'us-east-1' }}.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::${{ github.event.inputs.aws_account_id || '958312553089' }}:role/${{ github.event.inputs.project_name || 'online-boutique' }}-github-actions-role

permissions:
  id-token: write
  contents: read
  security-events: write  # Required for SARIF uploads

# Safe concurrency to auto-cancel overlapping runs
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services-matrix: ${{ steps.services.outputs.matrix }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare services matrix
        id: services
        run: |
          ALL_SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]'
          
          if [ "${{ github.event.inputs.services }}" = "all" ] || [ -z "${{ github.event.inputs.services }}" ]; then
            echo "matrix=${ALL_SERVICES}" >> $GITHUB_OUTPUT
          else
            # Convert comma-separated input to JSON array
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            SERVICES_JSON="["
            for i in "${!SERVICES[@]}"; do
              if [ $i -gt 0 ]; then SERVICES_JSON+=","; fi
              SERVICES_JSON+="\"$(echo ${SERVICES[i]} | xargs)\""
            done
            SERVICES_JSON+="]"
            echo "matrix=${SERVICES_JSON}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate image metadata
        id: meta
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::8}
          IMAGE_TAG="v${TIMESTAMP}-${SHORT_SHA}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

  # Comprehensive filesystem scan (runs once per workflow, not per service)
  scan-repository:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy filesystem scan (SARIF format)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'
      
      - name: Run Trivy filesystem scan (human readable)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'
      
      # Security tab upload removed due to permissions issue  
      # SARIF files are still generated and saved as artifacts
      # - name: Upload filesystem scan to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always() && hashFiles('trivy-fs-results.sarif') != ''
      #   with:
      #     sarif_file: 'trivy-fs-results.sarif'
      
      - name: Upload filesystem scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-filesystem-scan
          path: |
            trivy-fs-results.sarif
            trivy-fs-report.txt
          retention-days: 7

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services-matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine build paths
        id: paths
        run: |
          SERVICE="${{ matrix.service }}"
          
          if [ "${SERVICE}" = "cartservice" ]; then
            BUILD_CONTEXT="./src/cartservice/src"
            DOCKERFILE="Dockerfile"
          else
            BUILD_CONTEXT="./src/${SERVICE}"
            DOCKERFILE="Dockerfile"
          fi
          
          echo "build-context=${BUILD_CONTEXT}" >> $GITHUB_OUTPUT
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT
          
          echo "=== Build Configuration for ${SERVICE} ==="
          echo "Build context: ${BUILD_CONTEXT}"
          echo "Dockerfile: ${DOCKERFILE}"
          
          # Verify paths exist
          if [ ! -d "${BUILD_CONTEXT}" ]; then
            echo "ERROR: Build context directory does not exist: ${BUILD_CONTEXT}"
            exit 1
          fi
          
          if [ ! -f "${BUILD_CONTEXT}/${DOCKERFILE}" ]; then
            echo "ERROR: Dockerfile does not exist: ${BUILD_CONTEXT}/${DOCKERFILE}"
            echo "Contents of ${BUILD_CONTEXT}:"
            ls -la "${BUILD_CONTEXT}"
            exit 1
          fi
          
          echo "✅ Paths verified for ${SERVICE}"
      
      # Dockerfile lint on PRs
      - name: Lint Dockerfile (hadolint)
        if: ${{ github.event_name == 'pull_request' }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ steps.paths.outputs.build-context }}/${{ steps.paths.outputs.dockerfile }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}-${{ matrix.service }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}"
          
          if ! aws ecr describe-repositories --repository-names "${REPO_NAME}" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "Creating ECR repository: ${REPO_NAME}"
            aws ecr create-repository \
              --repository-name "${REPO_NAME}" \
              --region ${{ env.AWS_REGION }} \
              --image-scanning-configuration scanOnPush=true
          else
            echo "ECR repository ${REPO_NAME} already exists"
          fi
      
      - name: Build and push image with cache
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.paths.outputs.build-context }}
          file: ${{ steps.paths.outputs.build-context }}/${{ steps.paths.outputs.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}:${{ needs.prepare.outputs.image-tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}:latest
          # GitHub Actions cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Use cache except for production releases (optional)
          no-cache: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' }}

      # Record built images as artifacts
      - name: Record built images
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image-tag }}"
          {
            echo "${{ env.ECR_REGISTRY }}/${REPO_NAME}:${IMAGE_TAG}"
            echo "${{ env.ECR_REGISTRY }}/${REPO_NAME}:latest"
          } > "images-${{ matrix.service }}.txt"

      - name: Upload images list artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.service }}
          path: images-${{ matrix.service }}.txt
          retention-days: 7

      # Generate SBOM for compliance
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}:${{ needs.prepare.outputs.image-tag }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30

      # Enhanced Trivy image scanning - FIXED VERSION
      - name: Run Trivy image scan (SARIF format)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}:${{ needs.prepare.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'   # Non-blocking for now
          
          # --- FUTURE: Uncomment to block builds on critical vulnerabilities ---
          # exit-code: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}

      - name: Run Trivy image scan (human readable)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}:${{ needs.prepare.outputs.image-tag }}
          format: 'table'
          output: 'trivy-image-${{ matrix.service }}.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'

      # Security tab upload removed due to permissions issue
      # SARIF files are still generated and saved as artifacts
      # - name: Upload Trivy image scan to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always() && hashFiles('trivy-image-${{ matrix.service }}.sarif') != ''
      #   with:
      #     sarif_file: 'trivy-image-${{ matrix.service }}.sarif'
      #     category: trivy-${{ matrix.service }}

      # Fixed artifact upload with file existence check
      - name: Upload Trivy image scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-scan-${{ matrix.service }}
          path: |
            trivy-image-${{ matrix.service }}.sarif
            trivy-image-${{ matrix.service }}.txt
          retention-days: 30
          if-no-files-found: warn  # Don't fail if files are missing

  summary:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "=== Build Summary ==="
          echo "Environment: ${{ needs.prepare.outputs.environment }}"
          echo "Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          echo "Services Built: ${{ join(fromJson(needs.prepare.outputs.services-matrix), ', ') }}"
          echo ""
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All builds completed successfully!"
            echo ""
            echo "To deploy these images, run the Deploy workflow with:"
            echo "  Environment: ${{ needs.prepare.outputs.environment }}"
            echo "  Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          else
            echo "❌ Some builds failed. Check the build logs above."
            exit 1
          fi

      # Aggregate artifacts into the GitHub Job Summary
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true  # Don't fail if some artifacts are missing

      - name: Job Summary (markdown)
        run: |
          {
            echo "## 🚀 Build Summary"
            echo "- **Environment**: ${{ needs.prepare.outputs.environment }}"
            echo "- **Image Tag**: \`${{ needs.prepare.outputs.image-tag }}\`"
            echo "- **Event**: \`${{ github.event_name }}\`"
            echo "- **Build Status**: ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }}"
            echo ""
            
            # Built Images Section
            echo "### 📦 Built Images"
            if ls images-*/images-*.txt >/dev/null 2>&1; then
              for f in images-*/images-*.txt; do
                service_name=$(basename "$f" .txt | sed 's/images-//')
                echo ""
                echo "**${service_name}**"
                sed 's/^/- /' "$f"
              done
            else
              echo "_No image artifacts found._"
            fi
            
            # Security Scan Results
            echo ""
            echo "### 🔒 Security Scan Results"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- **Filesystem Scan**: ${{ needs.scan-repository.result == 'success' && '✅ Completed' || '❌ Failed or Skipped' }}"
            fi
            
            echo "- **Image Security Scans**: Available in GitHub Security tab"
            echo "- **Build Status**: Check individual service logs for details"
            
            # Available Artifacts Section
            echo ""
            echo "### 📋 Available Artifacts"
            echo "- **Container Images**: Pushed to ECR with tags \`${{ needs.prepare.outputs.image-tag }}\` and \`latest\`"
            echo "- **SBOMs**: Software Bill of Materials for compliance (30-day retention)"
            echo "- **Security Scans**: Trivy vulnerability reports (30-day retention)"
            echo "- **Image Lists**: Registry URLs for deployment workflows (7-day retention)"
            
            # Next Steps
            echo ""
            echo "### 🚦 Next Steps"
            if [ "${{ needs.build.result }}" = "success" ]; then
              echo "1. Review security scan results in the **Security** tab"
              echo "2. Run the **Deploy** workflow with the generated image tag"
              echo "3. Monitor application deployment and health checks"
            else
              echo "1. Check build logs for failed services above"
              echo "2. Fix any build or security issues"
              echo "3. Re-run the workflow once issues are resolved"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
