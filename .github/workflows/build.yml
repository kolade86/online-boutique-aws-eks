name: Build Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      project_name:
        description: 'Project name'
        required: true
        default: 'online-boutique'
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      aws_account_id:
        description: 'AWS Account ID'
        required: true
        default: '078287196682'
      services:
        description: 'Services to build (comma-separated or "all")'
        required: false
        default: 'all'
  push:
    branches: [ main ]
    paths:
    - 'src/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/**'

env:
  PROJECT_NAME: ${{ github.event.inputs.project_name || 'online-boutique' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ github.event.inputs.aws_account_id || '225934518357' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  ECR_REGISTRY: ${{ github.event.inputs.aws_account_id || '225934518357' }}.dkr.ecr.${{ github.event.inputs.aws_region || 'us-east-1' }}.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::${{ github.event.inputs.aws_account_id || '225934518357' }}:role/${{ github.event.inputs.project_name || 'online-boutique' }}-github-actions-role

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services-matrix: ${{ steps.services.outputs.matrix }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare services matrix
        id: services
        run: |
          ALL_SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]'
          
          if [ "${{ github.event.inputs.services }}" = "all" ] || [ -z "${{ github.event.inputs.services }}" ]; then
            echo "matrix=${ALL_SERVICES}" >> $GITHUB_OUTPUT
          else
            # Convert comma-separated input to JSON array
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            SERVICES_JSON="["
            for i in "${!SERVICES[@]}"; do
              if [ $i -gt 0 ]; then SERVICES_JSON+=","; fi
              SERVICES_JSON+="\"$(echo ${SERVICES[i]} | xargs)\""
            done
            SERVICES_JSON+="]"
            echo "matrix=${SERVICES_JSON}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate image metadata
        id: meta
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::8}
          IMAGE_TAG="v${TIMESTAMP}-${SHORT_SHA}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services-matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine build paths
        id: paths
        run: |
          SERVICE="${{ matrix.service }}"
          
          if [ "${SERVICE}" = "cartservice" ]; then
            BUILD_CONTEXT="./src/cartservice/src"
            DOCKERFILE="Dockerfile"
          else
            BUILD_CONTEXT="./src/${SERVICE}"
            DOCKERFILE="Dockerfile"
          fi
          
          echo "build-context=${BUILD_CONTEXT}" >> $GITHUB_OUTPUT
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT
          
          echo "=== Build Configuration for ${SERVICE} ==="
          echo "Build context: ${BUILD_CONTEXT}"
          echo "Dockerfile: ${DOCKERFILE}"
          
          # Verify paths exist
          if [ ! -d "${BUILD_CONTEXT}" ]; then
            echo "ERROR: Build context directory does not exist: ${BUILD_CONTEXT}"
            exit 1
          fi
          
          if [ ! -f "${BUILD_CONTEXT}/${DOCKERFILE}" ]; then
            echo "ERROR: Dockerfile does not exist: ${BUILD_CONTEXT}/${DOCKERFILE}"
            echo "Contents of ${BUILD_CONTEXT}:"
            ls -la "${BUILD_CONTEXT}"
            exit 1
          fi
          
          echo "✅ Paths verified for ${SERVICE}"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}"
          
          if ! aws ecr describe-repositories --repository-names "${REPO_NAME}" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "Creating ECR repository: ${REPO_NAME}"
            aws ecr create-repository \
              --repository-name "${REPO_NAME}" \
              --region ${{ env.AWS_REGION }} \
              --image-scanning-configuration scanOnPush=true
          else
            echo "ECR repository ${REPO_NAME} already exists"
          fi
      
      - name: Build and push image
        working-directory: ${{ steps.paths.outputs.build-context }}
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image-tag }}"
          
          IMAGE_VERSIONED="${{ env.ECR_REGISTRY }}/${REPO_NAME}:${IMAGE_TAG}"
          IMAGE_LATEST="${{ env.ECR_REGISTRY }}/${REPO_NAME}:latest"
          
          echo "=== Building ${{ matrix.service }} ==="
          echo "Working directory: $(pwd)"
          echo "Repository: ${REPO_NAME}"
          echo "Tag: ${IMAGE_TAG}"
          echo "Dockerfile: ${{ steps.paths.outputs.dockerfile }}"
          
          echo "Contents of build context:"
          ls -la .
          
          # Build with progress output
          docker build \
            --no-cache \
            --progress=plain \
            -f ${{ steps.paths.outputs.dockerfile }} \
            -t "${IMAGE_VERSIONED}" \
            -t "${IMAGE_LATEST}" \
            .
          
          echo "Pushing images..."
          docker push "${IMAGE_VERSIONED}"
          docker push "${IMAGE_LATEST}"
          
          echo "✅ Successfully built and pushed ${{ matrix.service }}:"
          echo "  Versioned: ${IMAGE_VERSIONED}"
          echo "  Latest: ${IMAGE_LATEST}"

  summary:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Build Summary
        run: |
          echo "=== Build Summary ==="
          echo "Environment: ${{ needs.prepare.outputs.environment }}"
          echo "Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          echo "Services Built: ${{ join(fromJson(needs.prepare.outputs.services-matrix), ', ') }}"
          echo ""
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All builds completed successfully!"
            echo ""
            echo "To deploy these images, run the Deploy workflow with:"
            echo "  Environment: ${{ needs.prepare.outputs.environment }}"
            echo "  Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          else
            echo "❌ Some builds failed. Check the build logs above."
            exit 1
          fi
