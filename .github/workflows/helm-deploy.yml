name: Helm Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      project_name:
        description: 'Project name'
        required: true
        default: 'online-boutique'
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
      aws_account_id:
        description: 'AWS Account ID'
        required: true
        default: '339712717889'
      image_tag:
        description: 'Image tag to deploy (e.g., v20241003-abc123)'
        required: true
      services:
        description: 'Services to deploy (comma-separated or "all")'
        required: false
        default: 'all'

env:
  PROJECT_NAME: ${{ github.event.inputs.project_name }}
  AWS_REGION: ${{ github.event.inputs.aws_region }}
  AWS_ACCOUNT_ID: ${{ github.event.inputs.aws_account_id }}
  ECR_REGISTRY: ${{ github.event.inputs.aws_account_id }}.dkr.ecr.${{ github.event.inputs.aws_region }}.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::${{ github.event.inputs.aws_account_id }}:role/${{ github.event.inputs.project_name }}-github-actions-role

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services-matrix: ${{ steps.services.outputs.matrix }}
      image-tag: ${{ steps.validate.outputs.image-tag }}

    steps:
      - name: Validate inputs
        id: validate
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"

          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]{8}-[0-9]{6}-[a-f0-9]{8}$ ]]; then
            echo "WARNING: Image tag '${IMAGE_TAG}' doesn't match expected format (v20241003-123456-abc12345)"
            echo "Proceeding anyway..."
          fi

          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Using image tag: ${IMAGE_TAG}"

      - name: Prepare services matrix
        id: services
        run: |
          ALL_SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]'

          if [ "${{ github.event.inputs.services }}" = "all" ]; then
            echo "matrix=${ALL_SERVICES}" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            SERVICES_JSON="["
            for i in "${!SERVICES[@]}"; do
              if [ $i -gt 0 ]; then SERVICES_JSON+=","; fi
              SERVICES_JSON+="\"$(echo ${SERVICES[i]} | xargs)\""
            done
            SERVICES_JSON+="]"
            echo "matrix=${SERVICES_JSON}" >> $GITHUB_OUTPUT
          fi

  get-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      redis-endpoint: ${{ steps.infrastructure.outputs.redis-endpoint }}
      cluster-name: ${{ steps.infrastructure.outputs.cluster-name }}
      namespace: ${{ steps.infrastructure.outputs.namespace }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover infrastructure
        id: infrastructure
        run: |
          ENV="${{ github.event.inputs.environment }}"

          echo "=== Infrastructure Discovery ==="

          # Discover Redis
          REDIS_ID="${{ env.PROJECT_NAME }}-${ENV}-redis"
          echo "Looking for Redis cluster: ${REDIS_ID}"

          REDIS_ENDPOINT=$(aws elasticache describe-replication-groups \
            --replication-group-id "${REDIS_ID}" \
            --region ${{ env.AWS_REGION }} \
            --query 'ReplicationGroups[0].NodeGroups[0].PrimaryEndpoint.Address' \
            --output text):6379

          if [ "${REDIS_ENDPOINT}" = "None:6379" ]; then
            echo "ERROR: Redis cluster not found: ${REDIS_ID}"
            aws elasticache describe-replication-groups --region ${{ env.AWS_REGION }} --query 'ReplicationGroups[*].ReplicationGroupId' --output text
            exit 1
          fi

          echo "Redis found: ${REDIS_ENDPOINT}"

          # Discover EKS
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-${ENV}-cluster"
          echo "Looking for EKS cluster: ${CLUSTER_NAME}"

          if aws eks describe-cluster --name "${CLUSTER_NAME}" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "EKS cluster found: ${CLUSTER_NAME}"
          else
            echo "ERROR: EKS cluster not found: ${CLUSTER_NAME}"
            echo "Available clusters:"
            aws eks list-clusters --region ${{ env.AWS_REGION }} --query 'clusters' --output text
            exit 1
          fi

          # Set namespace
          NAMESPACE="${{ env.PROJECT_NAME }}-${ENV}"

          echo "=== Infrastructure Summary ==="
          echo "Redis: ${REDIS_ENDPOINT}"
          echo "EKS: ${CLUSTER_NAME}"
          echo "Namespace: ${NAMESPACE}"

          echo "redis-endpoint=${REDIS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "cluster-name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT

  verify-images:
    needs: [prepare, get-infrastructure]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services-matrix) }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ github.event.inputs.environment }}-${{ matrix.service }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image-tag }}"

          echo "Verifying image: ${REPO_NAME}:${IMAGE_TAG}"

          if aws ecr describe-images \
            --repository-name "${REPO_NAME}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "Image found: ${REPO_NAME}:${IMAGE_TAG}"
          else
            echo "Image not found: ${REPO_NAME}:${IMAGE_TAG}"
            echo "Available tags in repository:"
            aws ecr list-images --repository-name "${REPO_NAME}" --region ${{ env.AWS_REGION }} --query 'imageIds[*].imageTag' --output text | head -10
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, get-infrastructure, verify-images]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.get-infrastructure.outputs.cluster-name }} \
            --region ${{ env.AWS_REGION }}

          kubectl cluster-info
          echo "kubectl configured successfully"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.3'

      - name: Adopt existing resources for Helm
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"

          # If this is the first Helm deploy, existing Kustomize-managed resources
          # need Helm ownership labels/annotations so Helm can adopt them.
          if ! helm status online-boutique -n "${NAMESPACE}" > /dev/null 2>&1; then
            echo "No existing Helm release found. Adopting existing resources..."

            RESOURCE_TYPES="deployment service configmap horizontalpodautoscaler podDisruptionBudget ingress"

            for kind in $RESOURCE_TYPES; do
              RESOURCES=$(kubectl get "${kind}" -n "${NAMESPACE}" -o name 2>/dev/null || true)
              for resource in $RESOURCES; do
                echo "Adopting ${resource}..."
                kubectl annotate "${resource}" -n "${NAMESPACE}" \
                  meta.helm.sh/release-name=online-boutique \
                  meta.helm.sh/release-namespace="${NAMESPACE}" \
                  --overwrite
                kubectl label "${resource}" -n "${NAMESPACE}" \
                  app.kubernetes.io/managed-by=Helm \
                  --overwrite
              done
            done

            echo "Resource adoption complete"
          else
            echo "Helm release already exists, skipping adoption"
          fi

      - name: Deploy with Helm
        run: |
          ENV="${{ github.event.inputs.environment }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image-tag }}"
          REDIS_ENDPOINT="${{ needs.get-infrastructure.outputs.redis-endpoint }}"
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"

          echo "=== Helm Deploy ==="
          echo "Environment: ${ENV}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Redis endpoint: ${REDIS_ENDPOINT}"
          echo "Namespace: ${NAMESPACE}"
          echo "Registry: ${{ env.ECR_REGISTRY }}"

          # Build values file args
          VALUES_ARGS=""
          if [ -f "helm/online-boutique/values-${ENV}.yaml" ]; then
            VALUES_ARGS="-f helm/online-boutique/values-${ENV}.yaml"
            echo "Using environment values file: values-${ENV}.yaml"
          fi

          # Dry-run first
          echo "=== Dry Run ==="
          helm upgrade --install online-boutique ./helm/online-boutique \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set image.registry=${{ env.ECR_REGISTRY }} \
            --set image.prefix=${{ env.PROJECT_NAME }}-${ENV} \
            --set image.tag=${IMAGE_TAG} \
            --set redis.addr=${REDIS_ENDPOINT} \
            ${VALUES_ARGS} \
            --dry-run

          # Apply
          echo "=== Deploying ==="
          helm upgrade --install online-boutique ./helm/online-boutique \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set image.registry=${{ env.ECR_REGISTRY }} \
            --set image.prefix=${{ env.PROJECT_NAME }}-${ENV} \
            --set image.tag=${IMAGE_TAG} \
            --set redis.addr=${REDIS_ENDPOINT} \
            ${VALUES_ARGS} \
            --wait \
            --timeout 5m

          echo "Helm deploy completed successfully"

      - name: Wait for deployments
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"

          echo "=== Waiting for deployments to be ready ==="

          DEPLOYMENTS=$(kubectl get deployments -n "${NAMESPACE}" -o name | cut -d'/' -f2)

          for deployment in $DEPLOYMENTS; do
            echo "Waiting for deployment/${deployment}..."
            if kubectl rollout status deployment/${deployment} -n "${NAMESPACE}" --timeout=300s; then
              echo "${deployment} is ready"
            else
              echo "${deployment} failed to become ready"
              kubectl describe deployment/${deployment} -n "${NAMESPACE}"
              kubectl get pods -n "${NAMESPACE}" -l app=${deployment}
            fi
          done

      - name: Verify deployment
        run: |
          NAMESPACE="${{ needs.get-infrastructure.outputs.namespace }}"

          echo "=== Deployment Verification ==="
          echo "Namespace: ${NAMESPACE}"
          echo "Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          echo ""

          echo "=== Helm Release Status ==="
          helm status online-boutique -n "${NAMESPACE}"
          echo ""

          echo "=== Pod Status ==="
          kubectl get pods -n "${NAMESPACE}" -o wide
          echo ""

          echo "=== Service Status ==="
          kubectl get svc -n "${NAMESPACE}"
          echo ""

          echo "=== Ingress Status ==="
          kubectl get ingress -n "${NAMESPACE}" || echo "No ingress found"
          echo ""

          echo "=== Recent Events ==="
          kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' | tail -10

      - name: Annotate Grafana Cloud deployment
        if: success()
        run: |
          TIMESTAMP=$(date +%s)000
          SERVICES="${{ join(fromJson(needs.prepare.outputs.services-matrix), ', ') }}"

          curl -s -X POST \
            https://odusanyakolade20.grafana.net/api/annotations \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_CLOUD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"time\": ${TIMESTAMP},
              \"tags\": [\"deployment\", \"${{ github.event.inputs.environment }}\", \"helm\", \"github-actions\"],
              \"text\": \"Helm deployed ${SERVICES} with tag ${{ needs.prepare.outputs.image-tag }} to ${{ github.event.inputs.environment }} by ${{ github.actor }}\"
            }" && echo "Grafana annotation created" || echo "Grafana annotation failed (non-blocking)"

      - name: Verify Redis configuration
        run: |
          REDIS_HOST=$(echo "${{ needs.get-infrastructure.outputs.redis-endpoint }}" | cut -d':' -f1)
          REDIS_PORT=$(echo "${{ needs.get-infrastructure.outputs.redis-endpoint }}" | cut -d':' -f2)

          echo "=== Redis Configuration ==="
          echo "Redis endpoint: ${REDIS_HOST}:${REDIS_PORT}"
          kubectl get configmap redis-config -n ${{ needs.get-infrastructure.outputs.namespace }} -o yaml
          echo "Redis connectivity will be verified by cartservice startup"

  summary:
    needs: [prepare, get-infrastructure, verify-images, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "=== Helm Deployment Summary ==="
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Image Tag: ${{ needs.prepare.outputs.image-tag }}"
          echo "Services Deployed: ${{ join(fromJson(needs.prepare.outputs.services-matrix), ', ') }}"
          echo "Cluster: ${{ needs.get-infrastructure.outputs.cluster-name }}"
          echo "Namespace: ${{ needs.get-infrastructure.outputs.namespace }}"
          echo "Redis Endpoint: ${{ needs.get-infrastructure.outputs.redis-endpoint }}"
          echo ""

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Deployment completed successfully!"
            echo ""
            echo "Useful commands:"
            echo "  helm status online-boutique -n ${{ needs.get-infrastructure.outputs.namespace }}"
            echo "  helm history online-boutique -n ${{ needs.get-infrastructure.outputs.namespace }}"
            echo "  kubectl get pods -n ${{ needs.get-infrastructure.outputs.namespace }}"
            echo "  kubectl get ingress -n ${{ needs.get-infrastructure.outputs.namespace }}"
          else
            echo "Deployment failed. Check the logs above."
            echo ""
            echo "To rollback:"
            echo "  helm rollback online-boutique -n ${{ needs.get-infrastructure.outputs.namespace }}"
            exit 1
          fi
