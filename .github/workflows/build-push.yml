name: Build and Push to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 225934518357.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::225934518357:role/online-boutique-github-actions-role

permissions:
  id-token: write
  contents: read
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set Dockerfile path
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" == "cartservice" ]; then
            echo "path=./src/cartservice/src" >> $GITHUB_OUTPUT
          else
            echo "path=./src/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push ${{ matrix.service }}
        working-directory: ${{ steps.dockerfile.outputs.path }}
        run: |
          docker build -t $ECR_REGISTRY/online-boutique-dev-${{ matrix.service }}:latest .
          docker push $ECR_REGISTRY/online-boutique-dev-${{ matrix.service }}:latest
          echo "✓ ${{ matrix.service }} built and pushed successfully"